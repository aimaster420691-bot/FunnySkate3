name: Build Skate 3 Fun Trainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --config Release

      - name: Upload trainer
        uses: actions/upload-artifact@v4
        with:
          name: Skate3FunTrainer-Windows
          path: |
            build/*.dll
            build/*.exe
